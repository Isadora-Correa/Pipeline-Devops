name: CI/CD - UX em Foco
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Gerar e verificar build
        run: npm run build && test -f dist/index.html && test -f dist/style.css && test -f dist/script.js && test -f dist/favicon.svg

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Executar testes automatizados
        run: npm test

  quality:
    name: Quality
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Analisar qualidade do código
        run: npm run lint

  security:
    name: Security
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Procurar vulnerabilidades
        run: npm audit --audit-level=high

  package:
    name: Package
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Empacotar e conferir aplicação
        run: npm run build && find dist -maxdepth 1 -type f -print

  deploy:
    name: Deploy
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - name: Gerar build de produção
        run: npm ci && npm run build
      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  smoke-test:
    name: Smoke Test
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - name: Preparar aplicação
        run: npm ci && npm run build
      - name: Verificar resposta da página
        run: |
          npx --yes serve dist -l 3000 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for attempt in 1 2 3 4 5; do
            curl --fail --silent http://localhost:3000/ > /dev/null && exit 0
            sleep 1
          done
          exit 1

  performance:
    name: Performance
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - name: Gerar aplicação
        run: npm ci && npm run build
      - name: Validar tamanho do site
        run: |
          SIZE=$(du -sk dist | cut -f1)
          echo "Tamanho total: ${SIZE} KB"
          test "$SIZE" -lt 1024

  monitoring:
    name: Monitoring
    needs: performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Confirmar publicação
        run: git ls-remote --exit-code origin refs/heads/gh-pages
      - run: echo "Pipeline concluída e branch gh-pages disponível."
